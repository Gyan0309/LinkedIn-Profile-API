# Fly.io deployment.
#
# There are no secrets to set. The service stores no LinkedIn session and no API
# key of its own -- callers send their own session per request, so there is
# nothing on this machine to leak.
#
#   fly launch --no-deploy --copy-config
#   fly deploy

app = "linkedin-profile-api"

# Stockholm. LinkedIn is more suspicious of a session used far from where it was
# created, and a caller's session surviving is the whole point.
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  RATE_LIMIT_PER_HOUR = "60"
  # LinkedIn blocks an IP as a unit, so one heavy caller getting the shared
  # outbound address flagged would break the service for everyone.
  OUTBOUND_MAX_PER_MINUTE = "30"
  CACHE_TTL_SECONDS = "21600"
  LOG_LEVEL = "INFO"
  # Logs go to Fly's collector, not a terminal.
  LOG_COLOUR = "never"


[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Scales to zero. Fly resumes in a second or two -- which is why this is on
  # Fly rather than Render's free tier and its ~50s cold start.
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # Low on purpose: concurrency here becomes concurrent LinkedIn traffic.
    soft_limit = 10
    hard_limit = 25

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
