# Render blueprint, a working alternative to fly.toml on the same Dockerfile.
# Fly is what's deployed -- see fly.toml for why.
#
# There are no secrets to set. Callers send their own LinkedIn session per
# request; the service stores none of its own.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz

    envVars:
      - key: RATE_LIMIT_PER_HOUR
        value: "60"
      # LinkedIn blocks an IP as a unit, so one heavy caller getting the shared
      # outbound address flagged would break it for everyone.
      - key: OUTBOUND_MAX_PER_MINUTE
        value: "30"
      - key: CACHE_TTL_SECONDS
        value: "21600"
      - key: LOG_LEVEL
        value: INFO
      # Logs go to Render's collector, not a terminal.
      - key: LOG_COLOUR
        value: never

      # Set in the dashboard, from scripts/pin_queryids.py. Pinned ids mean the
      # service never fetches a LinkedIn HTML page, which draws HTTP 999.
      - key: LINKEDIN_QUERY_IDS_JSON
        sync: false

      # Optional residential proxy, for when the host IP gets flagged anyway.
      - key: OUTBOUND_PROXY_URL
        sync: false
